<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 — 하루 상점</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #2f2a26;
      background: #f7f3ef;
    }
    main {
      width: min(100%, 420px);
      padding: 32px;
      border: 1px solid #e5ddd5;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 30px rgba(47, 42, 38, 0.08);
    }
    h1 { margin: 0 0 24px; font-size: 28px; }
    label { display: block; margin: 16px 0 8px; font-weight: 600; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cfc4ba;
      border-radius: 8px;
      font: inherit;
    }
    .actions { display: flex; gap: 8px; margin-top: 24px; }
    button {
      flex: 1;
      padding: 12px 10px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: #6f5846;
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: #594535; }
    #status { min-height: 24px; margin: 20px 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>하루 상점 로그인</h1>
    <form id="auth-form">
      <label for="email">이메일</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <div class="actions">
        <button id="signup" type="button">가입</button>
        <button id="login" type="submit">로그인</button>
        <button id="logout" type="button">로그아웃</button>
      </div>
    </form>
    <p id="status" aria-live="polite"></p>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import {
      createUserWithEmailAndPassword,
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA0kTH70Gm6SXmk2i32D-wFpr97mXlufco",
      authDomain: "haru-shop-32b38.firebaseapp.com",
      projectId: "haru-shop-32b38",
      storageBucket: "haru-shop-32b38.firebasestorage.app",
      messagingSenderId: "675983958231",
      appId: "1:675983958231:web:398bf3df20fb83967c9092"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const form = document.querySelector("#auth-form");
    const email = document.querySelector("#email");
    const password = document.querySelector("#password");
    const status = document.querySelector("#status");

    const showSuccess = (message) => {
      status.textContent = message;
    };

    const showError = (error) => {
      status.textContent = error.code;
    };

    document.querySelector("#signup").addEventListener("click", async () => {
      try {
        await createUserWithEmailAndPassword(auth, email.value, password.value);
        showSuccess("가입되었습니다.");
      } catch (error) {
        showError(error);
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        await signInWithEmailAndPassword(auth, email.value, password.value);
        showSuccess("로그인되었습니다.");
      } catch (error) {
        showError(error);
      }
    });

    document.querySelector("#logout").addEventListener("click", async () => {
      try {
        await signOut(auth);
        showSuccess("로그아웃되었습니다.");
      } catch (error) {
        showError(error);
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        showSuccess("로그인 상태입니다.");
      }
    });
  </script>
</body>
</html>
