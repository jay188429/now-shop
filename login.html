<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 — 하루 상점</title>
  <!-- 동의 기본값 · 태그 관리자보다 먼저 -->
  <script src="assets/consent.js"></script>

  <!-- 태그 관리자 코드가 들어갈 자리 (머리) -->
  <!-- Google Tag Manager -->

new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],

  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #2f2a26;
      background: #f7f3ef;
    }
    main {
      width: min(100%, 420px);
      padding: 32px;
      border: 1px solid #e5ddd5;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 30px rgba(47, 42, 38, 0.08);
    }
    h1 { margin: 0 0 24px; font-size: 28px; }
    label { display: block; margin: 16px 0 8px; font-weight: 600; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cfc4ba;
      border-radius: 8px;
      font: inherit;
    }
    .actions { display: flex; gap: 8px; margin-top: 24px; }
    button {
      flex: 1;
      padding: 12px 10px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: #6f5846;
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: #594535; }
    .shared-computer-note { display: block; margin: 8px 0 0; color: #6f675c; font-size: 12px; }
    #status { min-height: 24px; margin: 20px 0 0; }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MQNWSZ93"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<!-- 태그 관리자 코드가 들어갈 자리 (몸통 맨 위) -->

  <main>
    <h1>하루 상점 로그인</h1>
    <form id="auth-form">
      <label for="email">이메일</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <div class="actions">
        <button id="signup" type="button">가입</button>
        <button id="login" type="submit">로그인</button>
        <button id="logout" type="button">로그아웃</button>
      </div>
      <small class="shared-computer-note">도서관이나 학교처럼 같이 쓰는 컴퓨터에서는, 달빛상회를 다 보신 뒤 로그아웃을 눌러 주세요.</small>
    </form>
    <p id="status" aria-live="polite"></p>
  </main>

  <script type="module">
    import {
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import { auth, authReady } from "./assets/auth.js";
    const form = document.querySelector("#auth-form");
    const email = document.querySelector("#email");
    const password = document.querySelector("#password");
    const status = document.querySelector("#status");
    const nextPage = new URLSearchParams(location.search).get("next");

    const showSuccess = (message) => {
      status.textContent = message;
    };

    const showError = (error) => {
      status.textContent = error.code;
    };

    const redirectAfterAuth = () => {
      if (nextPage === "mypage.html") {
        setTimeout(() => { location.href = nextPage; }, 250);
      }
    };

    document.querySelector("#signup").addEventListener("click", async () => {
      try {
        await createUserWithEmailAndPassword(auth, email.value, password.value);
        window.dataLayer = window.dataLayer || [];
        dataLayer.push({
          event: "sign_up",
          method: "email"
        });
        showSuccess("가입되었습니다.");
        redirectAfterAuth();
      } catch (error) {
        showError(error);
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        await signInWithEmailAndPassword(auth, email.value, password.value);
        showSuccess("로그인되었습니다.");
        redirectAfterAuth();
      } catch (error) {
        showError(error);
      }
    });

    document.querySelector("#logout").addEventListener("click", async () => {
      try {
        await signOut(auth);
        location.href = "index.html";
      } catch (error) {
        showError(error);
      }
    });

    authReady.then((user) => {
      if (user) {
        showSuccess("로그인 상태입니다.");
      }
    });
  </script>
</body>
</html>
